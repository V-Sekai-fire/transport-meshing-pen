# A pen release on RFD 2293's ladder: on a tag, the macOS arm64 and Windows x86_64 double
# engines from the service-godot-build release tools/frame/releases.env pins, the vendored
# addon's macOS and Windows binaries, and the guest ELFs, each engine and addon file checked
# against its release's SHA256SUMS. The rung plays through the oxrsys runtime and simulator at OXRSYS_COMMIT.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: The pinned engine, and the addon checked against its release
        run: |
          . tools/frame/releases.env
          echo "ENGINE_TAG=$ENGINE_TAG" >> "$GITHUB_ENV"
          echo "ADDON_TAG=$ADDON_TAG" >> "$GITHUB_ENV"
          echo "OXRSYS_COMMIT=$OXRSYS_COMMIT" >> "$GITHUB_ENV"
          base=https://github.com/V-Sekai-fire/service-godot-build/releases/download
          mac=libgodot_riscv.macos.template_release.double.universal
          mkdir -p release
          curl -fsSL -o engine.sums "$base/$ENGINE_TAG/SHA256SUMS"
          curl -fsSL -o addon.sums "$base/$ADDON_TAG/SHA256SUMS"
          for exe in godot.macos.editor.double.arm64 godot.windows.editor.double.x86_64.llvm.exe \
              godot.windows.editor.double.x86_64.llvm.console.exe; do
            curl -fsSL -o "release/$exe" "$base/$ENGINE_TAG/$exe"
            grep -q " $exe\$" engine.sums
            (cd release && grep " $exe\$" ../engine.sums | sha256sum -c --quiet -)
          done
          cp "addons/godot_sandbox/bin/$mac.framework/$mac" addons/godot_sandbox/bin/libgodot_riscv.windows.template_release.double.x86_64.dll release/
          for lib in "$mac" libgodot_riscv.windows.template_release.double.x86_64.dll; do
            grep -q " $lib\$" addon.sums
            (cd release && grep " $lib\$" ../addon.sums | sha256sum -c --quiet -)
          done
      - name: The ELFs and one SHA256SUMS
        run: |
          cp ./*.elf release/
          cd release && sha256sum * | tee SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "$GITHUB_REF_NAME" in *-dev.*|*-beta.*|*-rc.*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" $pre \
            --notes "Pen ${GITHUB_SHA}. macOS arm64 and Windows x86_64 engines ${ENGINE_TAG} and addon ${ADDON_TAG} from V-Sekai-fire/service-godot-build, each checked against its release's SHA256SUMS. Play it through the oxrsys runtime and simulator at V-Sekai-fire/oxrsys ${OXRSYS_COMMIT}." \
            release/*
