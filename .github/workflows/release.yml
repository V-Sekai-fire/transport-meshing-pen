# A pen release on RFD 2293's ladder: on a tag, the Windows double engine from the
# service-godot-build release tools/frame/releases.env pins, the vendored addon DLL, and
# the guest ELFs, each engine and addon file checked against its release's SHA256SUMS.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: The pinned engine, and the addon checked against its release
        run: |
          . tools/frame/releases.env
          echo "ENGINE_TAG=$ENGINE_TAG" >> "$GITHUB_ENV"
          echo "ADDON_TAG=$ADDON_TAG" >> "$GITHUB_ENV"
          base=https://github.com/V-Sekai-fire/service-godot-build/releases/download
          exe=godot.windows.editor.double.x86_64.llvm
          dll=libgodot_riscv.windows.template_release.double.x86_64.dll
          mkdir -p release
          curl -fsSL -o engine.sums "$base/$ENGINE_TAG/SHA256SUMS"
          curl -fsSL -o addon.sums "$base/$ADDON_TAG/SHA256SUMS"
          for f in "$exe.exe" "$exe.console.exe"; do
            curl -fsSL -o "release/$f" "$base/$ENGINE_TAG/$f"
            grep -q " $f\$" engine.sums
            (cd release && grep " $f\$" ../engine.sums | sha256sum -c --quiet -)
          done
          cp "addons/godot_sandbox/bin/$dll" release/
          grep -q " $dll\$" addon.sums
          (cd release && grep " $dll\$" ../addon.sums | sha256sum -c --quiet -)
      - name: The ELFs and one SHA256SUMS
        run: |
          cp ./*.elf release/
          cd release && sha256sum * | tee SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=
          case "$GITHUB_REF_NAME" in *-dev.*|*-beta.*|*-rc.*) pre=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" $pre \
            --notes "Pen ${GITHUB_SHA}. Engine ${ENGINE_TAG} and addon ${ADDON_TAG} from V-Sekai-fire/service-godot-build, each checked against its release's SHA256SUMS. Put it on the headset with tools/frame/push.sh ${GITHUB_REF_NAME}." \
            release/*
