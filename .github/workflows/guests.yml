# Build the guest ELFs from the goal manifest's checkouts, run the host
# harnesses, and gate this project on what was just built.
name: guests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2
  SLANG_VERSION: 2026.13.1
  # The goal manifest's branch; every project in it names its own revision.
  MANIFEST_BRANCH: main

jobs:
  build:
    name: build (${{ matrix.part }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: curvenet, args: "--no-host --targets=curvenet" }
          - { part: dress-on, args: "--no-host --targets=dress_on" }
          # lasso.elf is built, not tracked, so its call gate (tools/probe_guests.gd) runs where it
          # is built. The MuJoCo archives are LLVM 23.1.1 ThinLTO bitcode, which apt's clang 18 cannot link.
          - { part: lasso-mujoco, args: "--no-host --targets=lasso,mujoco", gates: "load,guests", llvm: "23.1.1" }
          - { part: probes-ggml, args: "--no-host --targets=probes,ggml_test" }
          - { part: host, args: "--no-elfs" }
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          path: weft/1-transport/meshing-pen
      - name: Tools from apt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld llvm cmake ninja-build python3 spirv-tools xvfb
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"
      - name: slangc, Godot and repo
        run: |
          mkdir -p "$HOME/opt/slang" "$HOME/bin"
          curl -fsSL "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64.tar.gz" | tar -xz -C "$HOME/opt/slang"
          ln -sf "$HOME/opt/slang/bin/slangc" "$HOME/bin/slangc"
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -oq godot.zip -d "$HOME/opt" && ln -sf "$HOME/opt/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/bin/godot"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo" && chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: LLVM ${{ matrix.llvm }} from conda-forge
        if: matrix.llvm
        run: |
          curl -fsSL https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C "$HOME" bin/micromamba
          "$HOME/bin/micromamba" create -q -y -p "$HOME/opt/llvm" -c conda-forge \
            "clang==${{ matrix.llvm }}" "clangxx==${{ matrix.llvm }}" "lld==${{ matrix.llvm }}" "llvm-tools==${{ matrix.llvm }}"
          echo "$HOME/opt/llvm/bin" >> "$GITHUB_PATH"
      - name: The guests' repositories, from the goal manifest
        working-directory: weft
        run: |
          git config --global user.name "guests CI"
          git config --global user.email "guests-ci@users.noreply.github.com"
          repo init -q -u https://github.com/V-Sekai-fire/contract-manifest-taskweft -b "$MANIFEST_BRANCH" --depth=1 --no-clone-bundle
          repo sync -q -c --no-tags -j8 \
            contract-guest-runtime contract-guest-common contract-ggml-rd \
            interactor-curvenet interactor-lasso interactor-mujoco-sandbox-demo interactor-usd-guest ggml
      - name: Build, harnesses and the load gates
        working-directory: weft/1-transport/meshing-pen
        run: elixir tools/build.exs --gates=${{ matrix.gates || 'load' }} --no-bintr ${{ matrix.args }}
      - name: Keep the ELFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guests-${{ github.sha }}-${{ matrix.part }}
          path: weft/1-transport/meshing-pen/*.elf
