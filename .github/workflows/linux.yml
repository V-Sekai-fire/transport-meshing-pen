# The Skateboard's simulator gate on Linux, CPU-only: replay a saved-stroke
# .usda through the pipeline to MESH (curvenet is CPU in the guest, no
# RenderingDevice), so it runs headless with no GPU/lavapipe. The committed
# Linux sandbox .so and guest ELFs are used as-is; nothing is rebuilt.
name: linux
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  GODOT_VERSION: 4.7.2
jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Godot
        run: |
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -oq godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$PWD/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"
      - name: Import
        run: timeout 300 "$GODOT" --headless --path . --import || true
      - name: Load probe (curvenet.elf + usd.elf)
        run: GODOT="$GODOT" bash tools/test.sh
      - name: Saved-stroke replay gate (skirt.usda)
        run: |
          timeout 300 "$GODOT" --headless --path . --xr-mode off --script tools/gate_replay.gd -- \
            --strokes=tools/strokes/skirt.usda --out=replay.txt --wallclock=240
          echo "--- replay.txt ---"; cat replay.txt
          grep -q "RESULT: PASS" replay.txt
      - name: The replay gate's control (drop_seam must FAIL at MESH)
        run: |
          if timeout 300 "$GODOT" --headless --path . --xr-mode off --script tools/gate_replay.gd -- \
            --strokes=tools/strokes/skirt.usda --control=drop_seam --out=drop.txt --wallclock=240; then
            echo "the gate passed a skirt with no back seam"; exit 1
          fi
          echo "--- drop.txt ---"; cat drop.txt
          grep -q "RESULT: FAIL (FAILED(MESH:" drop.txt
      - name: The panel check's control (drop_patch:0 must FAIL by name)
        run: |
          if timeout 300 "$GODOT" --headless --path . --xr-mode off --script tools/gate_replay.gd -- \
            --strokes=tools/strokes/skirt.usda --control=drop_patch:0 --out=ctl.txt --wallclock=240; then
            echo "the gate passed a skirt with a panel missing"; exit 1
          fi
          echo "--- ctl.txt ---"; cat ctl.txt
          grep -q "panels: patch 0 has no triangles" ctl.txt
      - name: The body check's control (plant_inward must FAIL by name)
        run: |
          if timeout 300 "$GODOT" --headless --path . --xr-mode off --script tools/gate_replay.gd -- \
            --strokes=tools/strokes/skirt.usda --control=plant_inward --out=ctl.txt --wallclock=240; then
            echo "the gate passed a skirt with a vertex inside the body"; exit 1
          fi
          echo "--- ctl.txt ---"; cat ctl.txt
          grep -q "inside: 1 vertices inside the body" ctl.txt
      - name: Clean live strokes (RFD 3010 gate 3) and its control (no_clean must FAIL)
        run: |
          timeout 300 "$GODOT" --headless --path . --xr-mode off --script tools/gate_clean_strokes.gd | tee clean.txt
          grep -q "^RESULT: PASS" clean.txt
          if timeout 300 "$GODOT" --headless --path . --xr-mode off --script tools/gate_clean_strokes.gd -- --control=no_clean; then
            echo "the gate passed strokes that step back"; exit 1
          fi
      - name: The hand-drawn layer replays outside the body; without body_clear it must FAIL by name
        run: |
          timeout 300 "$GODOT" --headless --path . --xr-mode off --script tools/gate_replay.gd -- \
            --strokes=tools/strokes/dev4/hand-skirt-1-noreversal.usda --out=hand.txt --wallclock=240
          echo "--- hand.txt ---"; cat hand.txt
          grep -q "RESULT: PASS" hand.txt
          if timeout 300 "$GODOT" --headless --path . --xr-mode off --script tools/gate_replay.gd -- \
            --strokes=tools/strokes/dev4/hand-skirt-1-noreversal.usda --body_clear=false --out=hand0.txt --wallclock=240; then
            echo "the gate passed a skirt through the body"; exit 1
          fi
          grep -q "inside: 1 vertices inside the body" hand0.txt
