[workspace]
name = "meshing-pen"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = "3.13.*"
numpy = "*"
opencv = "*"
scons = "*"

[tasks]
# The ChArUco suit body end to end, one command: `pixi run suit`.
suit = { depends-on = ["engine", "engine-test", "suit-texture", "suit-check", "suit-orbit"] }

# The manifest's sibling engine (4-entities/godot): double editor with tests, incremental.
engine = { cmd = "scons platform=linuxbsd target=editor precision=double tests=yes", cwd = "../../4-entities/godot", env = { SCONSFLAGS = "-j14" } }
# Engine doctest: every lightmap_unwrap chart turns the same way (fails on a mirroring packer).
engine-test = { cmd = "tools/godot.sh --headless --test --test-case='*lightmap_unwrap*'", depends-on = ["engine"] }
# The suit sheet from the SOMA detector's own board; reads every marker back.
suit-texture = "python tools/suit_texture.py"
# Panel winding per avatar, marker reads from four sides, flipped renders must fail.
suit-check = { cmd = "tools/godot.sh --headless --path . --import > /dev/null 2>&1; sh tools/suit_check.sh", depends-on = ["suit-texture", "engine"] }
# Orbit views to the contract-orbit-views standard, and the zero-views control that must fail.
suit-orbit = { cmd = "sh tools/suit_orbit.sh", depends-on = ["suit-check"] }
